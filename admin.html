<script>
    if (window.lucide) {
        lucide.createIcons();
    }

    // Theme initialization
    const THEME_STORAGE_KEY = 'app-theme-color';
    function applyThemeColor(color) {
        if (color === 'blue') {
            document.documentElement.removeAttribute('data-theme');
        } else {
            document.documentElement.setAttribute('data-theme', color);
        }
    }
    let currentTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'blue';
    applyThemeColor(currentTheme);

    // Dark mode toggle listener
    document.getElementById('toggleDarkModeBtn').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        const getStorage = localStorage.getItem("darkMode");
        if(getStorage && getStorage === "dark"){
            localStorage.setItem("darkMode", "white");
        } else {
            localStorage.setItem("darkMode", "dark");
        }
    });
</script>
